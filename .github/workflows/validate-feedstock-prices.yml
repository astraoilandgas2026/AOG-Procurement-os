name: Validate feedstock price markers

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/FeedstockPriceTicker.tsx'
      - 'src/components/AppShell.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-feedstock-prices.yml'
  push:
    branches: [feature/price-marker-mvp]
    paths:
      - 'src/components/FeedstockPriceTicker.tsx'
      - 'src/components/AppShell.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-feedstock-prices.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
